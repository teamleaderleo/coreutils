name: Fieldwork stty size read only

on:
  push:
    branches:
      - fieldwork/stty-size-read-only-13722
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Apply and format fail-closed candidate
        run: |
          set -euo pipefail
          python3 .fieldwork/apply-stty-size-read-only.py
          cargo fmt --all
          test "$(git diff --name-only | sort)" = 'src/uu/stty/src/stty.rs'
          cargo fmt --all -- --check
          git diff --check

      - name: Test print-only state boundary
        run: cargo test -p uu_stty print_only_actions_do_not_require_tcsetattr --lib

      - name: Build stty
        run: cargo build -p uu_stty --bin stty

      - name: Prove background stty size is not stopped by SIGTTOU
        run: |
          python3 - <<'PY'
          import fcntl
          import os
          import pty
          import signal
          import termios
          import time

          binary = os.path.abspath("target/debug/stty")
          master, slave = pty.openpty()
          result_read, result_write = os.pipe()

          supervisor = os.fork()
          if supervisor == 0:
              os.close(result_read)
              os.close(master)
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
              os.tcsetpgrp(slave, os.getpgrp())

              child = os.fork()
              if child == 0:
                  os.setpgid(0, 0)
                  os.dup2(slave, 0)
                  os.dup2(slave, 1)
                  os.dup2(slave, 2)
                  if slave > 2:
                      os.close(slave)
                  os.execv(binary, [binary, "size"])

              os.close(slave)
              deadline = time.monotonic() + 5
              result = "timeout"
              status = None
              while time.monotonic() < deadline:
                  pid, status = os.waitpid(child, os.WNOHANG | os.WUNTRACED)
                  if pid:
                      if os.WIFSTOPPED(status):
                          result = f"stopped:{os.WSTOPSIG(status)}"
                      elif os.WIFEXITED(status):
                          result = f"exit:{os.WEXITSTATUS(status)}"
                      elif os.WIFSIGNALED(status):
                          result = f"signal:{os.WTERMSIG(status)}"
                      break
                  time.sleep(0.02)

              if result == "timeout" or result.startswith("stopped:"):
                  try:
                      os.kill(child, signal.SIGKILL)
                      os.kill(child, signal.SIGCONT)
                  except ProcessLookupError:
                      pass
                  try:
                      os.waitpid(child, 0)
                  except ChildProcessError:
                      pass

              os.write(result_write, result.encode())
              os.close(result_write)
              os._exit(0)

          os.close(result_write)
          os.close(slave)
          result = os.read(result_read, 128).decode()
          os.close(result_read)
          os.close(master)
          os.waitpid(supervisor, 0)
          print(result)
          assert result == "exit:0", result
          PY

      - name: Run stty integration module
        run: cargo test --features stty --no-default-features --test tests test_stty

      - name: Run focused clippy
        run: cargo clippy --features stty --no-default-features --all-targets -- -D warnings

      - name: Promote source-only candidate
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = 'src/uu/stty/src/stty.rs'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uu/stty/src/stty.rs
          git rm .fieldwork/apply-stty-size-read-only.py .github/workflows/fieldwork-stty-size-read-only.yml
          git commit -m "stty: skip tcsetattr for print-only settings"
          git push origin HEAD:"${GITHUB_REF_NAME}"

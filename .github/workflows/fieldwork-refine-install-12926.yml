name: Fieldwork refine install 12926

on:
  push:
    branches:
      - fieldwork/install-refuse-just-created-overwrite-12926

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Check candidate applies cleanly
        run: git apply --check .fieldwork/refine-install-12926.patch

      - name: Apply and format candidate
        run: |
          set -euo pipefail
          git apply .fieldwork/refine-install-12926.patch
          cargo fmt --all
          test "$(git diff --name-only | sort)" = $'src/uu/install/src/install.rs\ntests/by-util/test_install.rs'
          cargo fmt --all -- --check
          git diff --check

      - name: Test original refusal
        run: cargo test --features install --no-default-features test_install_refuses_to_overwrite_just_created_destination

      - name: Test backup preservation
        run: cargo test --features install --no-default-features test_install_refusal_preserves_original_simple_backup

      - name: Test numbered-backup exception
        run: cargo test --features install --no-default-features test_install_numbered_backups_allow_repeated_destination

      - name: Test compare no-op ownership
        run: cargo test --features install --no-default-features test_install_compare_noop_does_not_reserve_destination

      - name: Test missing-source ownership
        run: cargo test --features install --no-default-features test_install_missing_source_does_not_reserve_destination

      - name: Test copy-error ownership
        run: cargo test --features install --no-default-features test_install_copy_error_does_not_reserve_destination

      - name: Test post-copy failure ownership
        run: cargo test --features install --no-default-features test_install_post_copy_chown_failure_reserves_destination

      - name: Test strip cleanup ownership
        run: cargo test --features install --no-default-features test_install_strip_failure_releases_destination

      - name: Run install test module
        run: cargo test --features install --no-default-features --test tests test_install

      - name: Run focused clippy
        run: cargo clippy --features install --no-default-features --all-targets -- -D warnings

      - name: Promote verified source
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = $'src/uu/install/src/install.rs\ntests/by-util/test_install.rs'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uu/install/src/install.rs tests/by-util/test_install.rs
          git rm .fieldwork/refine-install-12926.patch .github/workflows/fieldwork-refine-install-12926.yml
          git commit -m "install: track just-created destinations across partial failures"
          git push origin HEAD:"${GITHUB_REF_NAME}"

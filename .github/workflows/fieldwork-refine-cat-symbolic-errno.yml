name: Fieldwork refine cat symbolic errno

on:
  push:
    branches:
      - fieldwork/cat-fd-classification-toctou-13042-v2
  pull_request:
    branches:
      - base/canonical-main-20260804

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Apply and format refinement
        run: |
          set -euo pipefail
          python3 .fieldwork/refine-cat-symbolic-errno.py
          cargo fmt --all
          test "$(git diff --name-only | sort)" = 'src/uu/cat/src/cat.rs'
          cargo fmt --all -- --check
          git diff --check

      - name: Test descriptor identity
        run: cargo test -p uu_cat opened_input_classification_survives_path_replacement --lib

      - name: Test preserved diagnostics
        run: |
          cargo test --features cat --no-default-features test_domain_socket
          cargo test --features cat --no-default-features test_error_loop
          cargo test --features cat --no-default-features test_directory

      - name: Run cat integration module
        run: cargo test --features cat --no-default-features --test tests test_cat

      - name: Run focused clippy
        run: cargo clippy --features cat --no-default-features --all-targets -- -D warnings

      - name: Promote source-only refinement
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = 'src/uu/cat/src/cat.rs'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uu/cat/src/cat.rs
          git rm .fieldwork/refine-cat-symbolic-errno.py .github/workflows/fieldwork-refine-cat-symbolic-errno.yml
          git commit -m "cat: map open failures by symbolic errno"
          git push origin HEAD:"${GITHUB_REF_NAME}"
